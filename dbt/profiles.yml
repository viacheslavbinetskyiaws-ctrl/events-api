# dbt looks for profiles.yml in the current working directory before
# falling back to ~/.dbt/ — keeping it here (project-local) rather than in
# the home directory makes the setup reproducible for anyone who clones
# this repo. Run dbt commands from inside dbt/, or pass --profiles-dir dbt.
#
# Connection values default to the docker-compose Postgres service so this
# works out of the box locally, but everything is overridable via env vars
# (the same habit as app/core/config.py) rather than hardcoded elsewhere.
events_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5432') | as_number }}"
      user: "{{ env_var('DBT_USER', 'events') }}"
      password: "{{ env_var('DBT_PASSWORD', 'events') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'events') }}"
      sslmode: "{{ env_var('DBT_SSLMODE', 'prefer') }}"
      schema: public
      threads: 4
    bigquery:
      type: bigquery
      method: oauth
      project: "{{ env_var('DBT_BIGQUERY_PROJECT', 'project-e8569bd6-524d-42fe-bb9') }}"
      dataset: "{{ env_var('DBT_BIGQUERY_DATASET', 'events_analytics') }}"
      impersonate_service_account: "{{ env_var('DBT_BIGQUERY_SA', 'big-query@project-e8569bd6-524d-42fe-bb9.iam.gserviceaccount.com') }}"
      location: US
      threads: 4
