version: 2

models:
  - name: daily_event_counts
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - event_type
              - utc_date
    columns:
      - name: event_count
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
