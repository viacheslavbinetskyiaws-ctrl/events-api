version: 2

models:
  - name: stg_events
    description: "Cleaned, explicity-typed passthrough of the app's raw `events` table - one row per ingested event, no aggregation. Feeds daily_event_counts."
    columns:
      - name: id
        description: "Unique identifier for the event, generated by the API at ingestion time (POST /events) - never supplied by the client."
        data_tests:
          - unique
          - not_null

      - name: event_type
        description: "The kind of event being tracked (e.g. 'signup', 'page_view') - a free-form string set by the client, not constrained to a fixed vocabulary yet."
        data_tests:
          - not_null
          - not_blank

      - name: user_id
        description: "Identifier of the user the event is attributed to, as supplied by the client - not validated against a real users table, since none exists yet."
        data_tests:
          - not_null
          - not_blank

      - name: occurred_at
        description: "When the event actually happened, as reported by the client - defaults to ingestion time if the client didn't supply one."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= current_timestamp"

      - name: properties
        description: "Arbitrary event-specific metadata as a JSON object, supplied by the client - intentionally unstructured/unvalidated beyond being valid JSON"
        data_tests:
          - not_null
