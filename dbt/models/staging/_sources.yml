version: 2

sources:
  - name: app
    description: Tables owned by the FastAPI app (written via SQLAlchemy/Alembic, not dbt).
    schema: public
    tables:
      - name: events
        description: Raw events as ingested by POST /events.
        config:
          loaded_at_field: ingested_at
          freshness:
            warn_after: { count: 1, period: hour }
            error_after: { count: 6, period: hour }
        columns:
          - name: id
          - name: tenant_id
          - name: event_type
          - name: user_id
          - name: occurred_at
          - name: ingested_at
          - name: properties
      - name: tenant_accounts
        description: Tenant registry, mutated via the admin CRUD endpoints. Also the CDC source for Milestone 8's Debezium connector.
        config:
          loaded_at_field: updated_at
          freshness:
            warn_after: { count: 1, period: day }
            error_after: { count: 7, period: day }
        columns:
          - name: id
          - name: name
          - name: plan_tier
          - name: created_at
          - name: updated_at
