apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: bigquery-events-sink
  namespace: events-api
  labels:
    strimzi.io/cluster: events-connect
spec:
  class: com.wepay.kafka.connect.bigquery.BigQuerySinkConnector
  tasksMax: 1
  # A FAILED task never retries on its own (confirmed live: a task sat
  # FAILED for over an hour after the replication slot it failed on had
  # already been dropped and recreated) — Strimzi's own reconciliation must
  # be told to retry it. Declarative rather than an imperative restart
  # trigger in platform-up.sh: the operator watches for failures on every
  # reconciliation (~2 min) and restarts on its own, so a self-healed
  # upstream cause (e.g. a lost slot cleared by bootstrap-roles) is picked
  # up without any script-side action.
  autoRestart:
    enabled: true
  config:
    topics: cdc.public.events
    project: project-e8569bd6-524d-42fe-bb9
    defaultDataset: events_analytics
    keyfile: /mnt/gcp/credential-config.json
    keySource: FILE
    sanitizeTopics: "true"
    autoCreateTables: "false"
    key.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: "false"
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: "false"
    topic2TableMap: cdc.public.events:cdc_events
    bigQueryPartitionDecorator: "false"
    transforms: unwrap
    transforms.unwrap.type: org.apache.kafka.connect.transforms.ExtractField$Value
    transforms.unwrap.field: after
---
