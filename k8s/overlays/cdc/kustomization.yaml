apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - kafka-statefulset.yaml
  - kafka-service.yaml
  - kafka-connect-deployment.yaml
  - kafka-connect-service.yaml
  - mongodb-statefulset.yaml
  - mongodb-service.yaml
  - streaming-configmap.yaml
  - cdc-consumer-deployment.yaml
  - cdc-register-connectors-job.yaml

configMapGenerator:
  - name: cdc-connector-setup
    namespace: events-api
    files:
      - scripts/create-publications.sql
      - scripts/tenant-accounts-connector.json
      - scripts/events-connector.json
      - scripts/register-connectors.sh
