apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: events-connect
  namespace: events-api
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  image: 938500344309.dkr.ecr.eu-central-1.amazonaws.com/events-api-kafka-connect:latest
  replicas: 1
  bootstrapServers: events-kafka-bootstrap:9092
  groupId: events-connect-cluster
  configStorageTopic: events-connect-configs
  statusStorageTopic: events-connect-status
  offsetStorageTopic: events-connect-offsets
  config:
    config.storage.replication.factor: 1
    offset.storage.replication.factor: 1
    status.storage.replication.factor: 1
    config.providers: env
    config.providers.env.class: org.apache.kafka.common.config.provider.EnvVarConfigProvider
  template:
    serviceAccount:
      metadata:
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::938500344309:role/events-api-iam-kafka-connect-gcp-irsa
    connectContainer:
      env:
        - name: DEBEZIUM_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: debezium-db-credentials
              key: password
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /mnt/gcp/credential-config.json
      volumeMounts:
        - name: gcp-wif-credential-config
          mountPath: /mnt/gcp
    pod:
      tolerations:
        - key: dedicated
          operator: Equal
          value: kafka-connect
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: eks.amazonaws.com/nodegroup
                    operator: In
                    values:
                      - events-api-kafka-connect
      volumes:
        - name: gcp-wif-credential-config
          configMap:
            name: gcp-wif-credential-config
  resources:
    requests:
      cpu: 250m
      memory: 850Mi
    limits:
      cpu: 500m
      memory: 1Gi
  jvmOptions:
    javaSystemProperties:
      - name: io.aiven.commons.auth.uri
        value: http://169.254.169.254/latest/meta-data/iam/security-credentials,http://169.254.169.254/latest/meta-data/placement/availability-zone
