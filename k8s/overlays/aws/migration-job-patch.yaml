apiVersion: batch/v1
kind: Job
metadata:
  name: events-api-migrate
  namespace: events-api
spec:
  # Created suspended: the bootstrap script releases it only after the first
  # `GRANT rds_iam TO events` has landed (a fresh RDS owner role cannot use IAM
  # auth before that), so it can never run too early.
  suspend: true
  template:
    spec:
      serviceAccountName: events-api-migrate
      containers:
        - name: migrate
          image: registry.placeholder.invalid/events-api-app:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: events-api-config
