# Trimmed for this cluster's actual remaining capacity (nodes confirmed live
# at 82-97% memory-requested before this install). nodeExporter is the one
# component cut entirely — it's a DaemonSet (must schedule on every
# untainted node, no scheduler choice) exporting host-OS-level EC2 stats
# nothing in this project reads. kubeStateMetrics stays: it's a single
# Deployment pod the scheduler can place anywhere, and its
# kube_deployment_status_replicas metric is what feeds this milestone's
# Grafana dashboard (and Milestone 7's HPA-replica-count bonus later).
nodeExporter:
  enabled: false

alertmanager:
  enabled: false
  # alertmanagerSpec:
  #   resources:
  #     requests:
  #       cpu: 25m
  #       memory: 64Mi
  #     limits:
  #       cpu: 100m
  #       memory: 128Mi

prometheus:
  prometheusSpec:
    tolerations:
      - key: dedicated
        operator: Equal
        value: kafka-connect
        effect: NoSchedule
    # Real bug found on a cold cluster-up (2026-09-22): the toleration above
    # lets Prometheus land on Kafka Connect's own dedicated (single-node)
    # node, and it landed there alongside Grafana — between the two of them
    # plus DaemonSet overhead, that filled the node before Connect ever
    # deployed (Helm installs before Connect does), leaving it Pending for
    # hours. A PriorityClass fix on Connect (see aws-connect/kafka-connect.yaml)
    # lets it preempt its way back on — but this constraint stops the two
    # heavy monitoring pods from ever stacking onto the SAME node in the
    # first place, so Connect finds room without needing to preempt at all.
    # Verified: one of Grafana(448Mi)/Prometheus(382Mi) alone, plus ~200Mi of
    # DaemonSets, plus Connect's 660Mi request, fits inside the node's 1365Mi
    # allocatable; both together (1030Mi) did not leave enough room.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            spread-group: kube-prometheus-stack-heavy
    podMetadata:
      labels:
        spread-group: kube-prometheus-stack-heavy
    retention: 6h
    replicas: 1
    # Original 256Mi request was under real observed usage (312Mi, confirmed
    # live during the Milestone 11 capacity crunch) — corrected up, the
    # opposite direction from most fixes this session, same as Grafana's
    # sidecars.
    resources:
      requests:
        cpu: 100m
        memory: 350Mi
      limits:
        cpu: 500m
        memory: 512Mi

prometheusOperator:
  # Trimmed (64Mi -> 48Mi) during the Milestone 11 capacity crunch — real
  # usage confirmed live at 27-29Mi, still ~1.65x headroom.
  resources:
    requests:
      cpu: 50m
      memory: 48Mi
    limits:
      cpu: 100m
      memory: 128Mi
  # Config-reloader sidecar (injected into every Prometheus/Alertmanager
  # pod, configured via the *operator's* own flags, not a per-CR field —
  # confirmed against the chart's actual template source) had zero
  # declared resources at all — completely unbounded, invisible to the
  # scheduler. Real usage confirmed live at 14Mi.
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

grafana:
  replicas: 1
  tolerations:
    - key: dedicated
      operator: Equal
      value: kafka-connect
      effect: NoSchedule
  # Same spread-group as prometheus.prometheusSpec above: prevents the two
  # heavy monitoring pods stacking onto the same node (see that comment for
  # the real bug this fixes). extraLabels feeds grafana's own pod template
  # labels (confirmed against the chart's actual template source, not
  # assumed), so topologySpreadConstraints' labelSelector can match both.
  extraLabels:
    spread-group: kube-prometheus-stack-heavy
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          spread-group: kube-prometheus-stack-heavy
  sidecar:
    # Real usage (confirmed live during the Milestone 11 capacity crunch:
    # 81-85Mi per sidecar container) runs ~2.5x over the original 32Mi
    # request — under-provisioned, not over, the opposite direction from
    # every other fix this session made. Corrected to reflect reality.
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        cpu: 100m
        memory: 160Mi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

kube-state-metrics:
  # Trimmed further (64Mi -> 40Mi -> 32Mi) during the Milestone 11 capacity
  # crunch — real usage confirmed live at 20-27Mi, still ~1.2-1.6x headroom.
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 80Mi
