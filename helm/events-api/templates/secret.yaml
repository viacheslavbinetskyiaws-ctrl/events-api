apiVersion: v1
kind: Secret
metadata:
  name: {{ include "events-api.fullname" . }}-secrets
  labels:
    {{- include "events-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
type: Opaque
stringData:
  APP_DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
