name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync
      - run: docker compose up -d --wait postgres
      - run: uv run pytest

  build-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/events-api-app:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/events-api-app:latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime-streaming
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/events-api-streaming:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/events-api-streaming:latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime-dbt
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/events-api-dbt:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/events-api-dbt:latest
      - uses: docker/build-push-action@v7
        with:
          context: ./realtime
          target: runtime
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/events-api-realtime:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/events-api-realtime:latest

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}
      # Manifests permanently reference :latest (see k8s/overlays/aws/
      # deployment-patch.yaml etc.) — a rollout restart is what forces
      # Kubernetes to actually re-pull it, since a running pod never
      # re-pulls on its own just because a new image was pushed to the
      # same tag. No image_tag input needed: this always deploys whatever
      # :latest currently is, which is exactly the most recent main-branch
      # build-push. cdc-consumer included too (same staleness issue, same
      # idempotent-replay-on-restart guarantee already proven — offsets
      # only commit after a successful write, and ON CONFLICT DO NOTHING/
      # upsert-by-id make any re-delivered in-flight message a safe no-op)
      # so nothing needs a separate manual restart step. No ordering
      # between the three — none depends on another being ready first,
      # each just reconnects to its own already-running upstream. The dbt
      # CronJob needs no restart at all — it creates a fresh pod every
      # hourly run, which already pulls :latest fresh every time.
      - run: kubectl rollout restart deployment/events-api deployment/realtime deployment/cdc-consumer -n events-api
