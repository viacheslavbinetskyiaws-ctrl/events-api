apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: events-api
spec:
  replicas: 1
  # Not scalable beyond 1 with emptyDir storage — each pod would get its
  # own empty volume, so replicas would each start with a blank database.
  # Fine for this cluster: kind is throwaway, data is meant to be ephemeral.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          envFrom:
            - secretRef:
                name: postgres-credentials
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "events", "-d", "events"]
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "events", "-d", "events"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}
