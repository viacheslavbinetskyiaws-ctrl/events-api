apiVersion: v1
kind: Secret
metadata:
  name: events-api-secrets
  namespace: events-api
type: Opaque
stringData:
  # Same credentials as postgres-secret.yaml, embedded in the full
  # connection URL — duplicated rather than composed, since raw k8s
  # manifests have no templating to build one Secret's value from
  # another's. A real setup might use Kustomize secretGenerator with a
  # shared value or a tool like External Secrets Operator to avoid this.
  APP_DATABASE_URL: "postgresql+asyncpg://events:events@postgres:5432/events"
